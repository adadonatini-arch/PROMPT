<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Partita ridotta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root { --sfondo: #000; --testo: #f2f2f2; --tenue: #7a7a7a; --linea: #333; --oro: #d9b25f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--sfondo); color: var(--testo); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; font-size: 13px; color: var(--tenue); letter-spacing: .04em; }
  header .titolo { color: var(--testo); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #orologio { font-variant-numeric: tabular-nums; color: var(--testo); }
  #barra { height: 2px; background: var(--linea); margin: 8px 0 0; }
  #barra-dentro { height: 2px; width: 0; background: var(--testo); }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #ordine { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(26px, 5.4vw, 64px); font-weight: 300; line-height: 1.2; padding: 24px 4px; overflow-wrap: anywhere; }
  #ordine.silenzio { color: var(--tenue); }
  #ordine.attesa { font-size: clamp(16px, 2.4vw, 24px); color: var(--tenue); }
  #ordine.culturale, #ordine.macabro { color: #e6e6e6; font-size: clamp(20px, 3.6vw, 40px); }
  #ordine.cinque { color: var(--oro); }
  #ordine.raffica { font-weight: 500; }
  #demo { display: none; gap: 10px; min-height: 0; }
  body.demo #ordine { flex: 0 0 auto; min-height: 22vh; font-size: clamp(20px, 3.4vw, 40px); }
  body.demo #demo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); flex: 1; }
  .pannello { border: 1px solid var(--linea); border-radius: 6px; position: relative; min-height: 220px; }
  .pannello .etichetta-pannello { position: absolute; top: 6px; left: 8px; font-size: 10px; letter-spacing: .14em; color: var(--tenue); }
  canvas { width: 100%; height: 100%; display: block; }
  #colonna-destra { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; min-height: 0; }
  #righe { font-size: 12px; font-variant-numeric: tabular-nums; }
  #righe .riga { display: grid; grid-template-columns: 20px 74px 82px 110px 52px minmax(0, 1fr); gap: 6px; padding: 3px 0; border-bottom: 1px solid #1a1a1a; align-items: baseline; }
  #righe .num { font-weight: 700; } #righe .riga.cinque { color: var(--oro); }
  #righe .etichetta { font-size: 10px; letter-spacing: .12em; color: var(--tenue); }
  #righe .st-IN_MOVIMENTO { color: #fff; font-weight: 600; } #righe .st-GESTO_TENUTO { color: #aaa; } #righe .st-FERMO { color: #777; }
  #righe .zona { color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comandi { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  button { background: transparent; color: var(--testo); border: 1px solid #555; border-radius: 4px; padding: 10px 14px; font: 600 12px system-ui; letter-spacing: .1em; cursor: pointer; min-height: 40px; }
  button:disabled { opacity: .3; cursor: default; }
  button.scelto { background: var(--testo); color: #000; }
  #corpi { display: flex; gap: 4px; align-items: center; font-size: 11px; letter-spacing: .12em; color: var(--tenue); }
  #corpi button { padding: 10px 12px; }
  label.seed { font-size: 11px; letter-spacing: .12em; color: var(--tenue); display: flex; gap: 6px; align-items: center; }
  input#seed { width: 92px; background: #000; color: var(--testo); border: 1px solid #555; border-radius: 4px; padding: 9px 8px; font: 14px system-ui; font-variant-numeric: tabular-nums; }
  #stato-cinque { font-size: 11px; color: var(--oro); }
  #avvisi { display: none; font-size: 12px; color: #c99; margin-top: 6px; }
  /* partita.html, generativo locale: modo, numeri del modello, origine della battuta, avviso (mai parlato) */
  #gen { font-size: 12px; color: #9ab; letter-spacing: .03em; }
  #origine { font-size: 10px; letter-spacing: .16em; color: var(--tenue); border: 1px solid var(--linea); border-radius: 3px; padding: 1px 5px; }
  #origine:empty { display: none; }
  #avviso-modello { display: none; font-size: 13px; color: #ff9a9a; border: 1px solid #6a2a2a; border-radius: 4px; padding: 8px 10px; margin-top: 8px; }
  #stato-regole, #stato-musica { font-size: 12px; color: #888; margin-top: 6px; letter-spacing: 0.04em; }
  body.nero::after { content: ""; position: fixed; inset: 0; background: #000; z-index: 50; cursor: pointer; }
  #fine { display: none; margin-top: 10px; font-size: 13px; } #fine h2 { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
  #fine table { border-collapse: collapse; width: 100%; max-width: 640px; } #fine td, #fine th { border-bottom: 1px solid #222; padding: 4px 6px; text-align: left; font-variant-numeric: tabular-nums; }
  #fine .nota { color: var(--tenue); font-size: 11px; }
  /* partita.html: pausa con cronometro, conto all'indietro, luce rossa */
  /* durante la pausa la voce dà gli ordini della pausa: il cronometro sta sotto, piccolo e discreto */
  #cronometro { display: none; flex: 0 0 auto; align-items: center; justify-content: center; font-size: clamp(36px, 8vw, 96px); font-weight: 200; color: #3a3a3a; font-variant-numeric: tabular-nums; letter-spacing: .02em; padding-bottom: 8px; }
  #ordine.conto { font-size: clamp(60px, 14vw, 160px); font-weight: 200; }
  #luce { display: none; color: #ff4040; font-weight: 700; letter-spacing: .16em; }
  body.rossa #luce { display: inline; }
  body.rossa:not(.demo) { background: #2a0000; }
  body.rossa #conto { background: #2a0000; }
  #conto { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; z-index: 9; }
  #conto-n { font-size: 120px; font-weight: 200; }
  @media (max-width: 760px) {
    body.demo #demo { grid-template-columns: minmax(0, 1fr); }
    #righe .riga { grid-template-columns: 18px 62px 74px 96px 46px; } #righe .zona { display: none; }
    .pannello { min-height: 200px; }
  }
</style>

<body>
<header>
  <span class="titolo">Partita ridotta</span><span>la comunità, il pubblico, i numeri</span>
  <span id="orologio">0:00 / 15:00</span><span id="fase"></span><span id="velocita"></span><span id="stato-cinque"></span><span id="luce">● LUCE ROSSA</span><span id="origine" hidden></span><span id="gen" hidden></span>
</header>
<div id="barra"><div id="barra-dentro"></div></div>
<main>
  <div id="ordine" class="attesa">Pronto.</div>
  <div id="cronometro"></div>
  <section id="demo">
    <div class="pannello"><span class="etichetta-pannello">PALCO · DALL'ALTO · ORDINATO</span><canvas id="palco"></canvas></div>
    <div id="colonna-destra">
      <div class="pannello"><span class="etichetta-pannello">MANICHINI · DI FRONTE (TRE QUARTI) · ORDINATO</span><canvas id="manichini"></canvas></div>
      <div id="righe"></div>
    </div>
  </section>
  <div id="fine"></div>
</main>
<div class="comandi">
  <button id="avvia">AVVIA</button><button id="freeze">FREEZE</button><button id="salta">SALTA</button>
  <button id="reset">RESET</button><button id="nuova">NUOVA SEQUENZA</button>
  <button id="regole">REGOLE, POI PARTITA</button><button id="carica-regole">CARICA REGOLE</button><input type="file" id="file-regole" accept="audio/*" hidden>
  <button id="carica-musica">CARICA MUSICA</button><input type="file" id="file-musica" accept="audio/*" hidden>
  <span id="corpi">CORPI <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></span>
  <label class="seed">SEED <input id="seed" type="number" inputmode="numeric" min="1"></label>
  <button id="modo" hidden>COMBINATORIO</button><button id="dimostrazione">DIMOSTRAZIONE: NO</button><button id="esporta">ESPORTA LOG</button>
</div>
<div id="stato-regole"></div>
<div id="stato-musica"></div>
<div id="avviso-modello"></div>
<div id="avvisi"></div>
<div id="conto"><div id="conto-n">10</div></div>
<script>
"use strict";
// Generato da build.sh — non modificare qui: si modifica core/ e versioni/, poi ./build.sh

// ───── core/costanti.js ─────
// ════════════════════════════════════════════════════════════
// COSTANTI CONDIVISE — tempi e limiti comuni alle tre versioni.
// I tempi propri di ogni versione (fasi, curva di velocità) stanno
// in versioni/A.js, versioni/B.js, versioni/C.js.
// ════════════════════════════════════════════════════════════

// ── attese dichiarate negli ordini (contate dalla fine della voce) ──
const SECONDI_PER_RIPETIZIONE = 2;   // "Ripeti quattro volte" ≈ 8 s
const SECONDI_RISATA = 3;            // "Ridi." dura 3 s
const DURATA_GESTO_SEMPLICE = 2;     // un ordine senza tempo dichiarato si esegue in 2 s
const DURATA_SPOSTAMENTO = 4;        // andare in un punto del quadrato
const FERMO_MASSIMO = 8;             // non si ordina "fermo" a chi è fermo da più di 8 s (tranne le stasi volute)

// ── voce ──
const RATE_VOCE_BASE = 1.0;
const RATE_VOCE_MASSIMA = 1.4;       // come nel base: sempre comprensibile
const RATE_VOCE_FINALE = 0.9;
const PAROLE_AL_SECONDO = 2.6;       // per stimare quanto dura una frase
const PARACADUTE_VOCE = 4;           // se la voce non chiude, si va avanti dopo la stima + 4 s

// ── anti-ripetizione ──
const MAX_USI_TESTO = 3;             // nessuna frase identica più di 3 volte (come nel base)
const RECENZA_AZIONE = 3;            // la stessa azione non torna nei 3 ordini successivi

// ── Archivi ──
const T_ARCHIVIO_TITOLO = 4;
const T_ARCHIVIO_FORMAZIONE = 6;
const T_ARCHIVIO_MUSICA = 25;        // loop dell'Archivio culturale, con musica sintetizzata
const T_MACABRO_LOOP = 40;           // loop dell'Archivio macabro, in silenzio
const T_ARCHIVIO_BASTA = 4;

// ── rottura del quadrato ──
const ROTTURA_MIN = 60, ROTTURA_MAX = 120;

// ── transizione ──
const DURATA_BLOCCHI = 60;           // primo minuto: mini-blocchi di ordini allo stesso numero
const BLOCCO_MIN = 3, BLOCCO_MAX = 5;
const CHIAMATE_OGNI = [14, 30];      // secondi tra una chiamata dentro/fuori e l'altra

// ── suono ──
const DISSOLVENZA = 12;              // musica → drone
const ANTICIPO_DRONE = 6;
const DISSOLVENZA_FINALE = 10;       // fade out finale, senza frasi
const PAUSA_DOPO_AUDIO = 3;
const DURATA_AUDIO_FINALE_STIMATA = 47;  // usata se il file non c'è (o in simulazione)
const DURATA_SENZA_AUDIO_FINALE = 14;

// ── formule che lasciano al corpo la scelta (vietate in partita.html: ogni ordine è preciso) ──
const FORMULE_SCELTA = /scegli|decid|come vuoi|come volete|a piacere|se vuoi|se volete|liber[oaie]\b|a scelta|quello che vuoi|quello che volete|con i propri tempi|con i tuoi tempi|quando vuoi|quando volete|se riesci|se riuscite|finché puoi|finché potete|qualcuno|qualsiasi|non importa|se il corpo lo fa/i;

// ── nomi di passi e di tecniche (mai detti: gli ordini sono solo anatomici) e frasi sulla fatica (mai dette) ──
const NOMI_PASSI_VIETATI = /pli[eé]\b|relev[eé]|tendu|d[eé]gag[eé]|arabesque|attitude|pirouette|port de bras|battement|rond de jambe|saut[eé]\b|ballon|chass[eé]|jet[eé]\b|release|contraction|floor ?work|contact improvisation|graham|cunningham|limón|limon/i;
const FRASI_FATICA = /non fermart|non fermatev|non rallent|stanc|non smett/i;

// ── numeri e parole ──
const NUM_PAROLE = ["", "uno", "due", "tre", "quattro", "cinque"];
const CIFRE = ["zero", "una", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove", "dieci", "undici", "dodici", "tredici", "quattordici", "quindici"];
const LATI = ["A", "B", "C", "D"];

// ───── core/seed.js ─────
// ════════════════════════════════════════════════════════════
// SEED E CASO — ogni partita parte da un seed; con lo stesso seed
// si rifà la stessa partita. Anti-ripetizione come nel base
// (contaUso / scegliDisponibile), più una memoria delle azioni recenti.
// ════════════════════════════════════════════════════════════

let SEED = 1, rnd = Math.random;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function semina(s) { SEED = s; rnd = mulberry32(s); }
function nuovoSeed() { return 10000 + Math.floor(Math.random() * 89999); }

function r(a) { return a[Math.floor(rnd() * a.length)]; }
function tra(x, y) { return x + rnd() * (y - x); }
function intero(x, y) { return x + Math.floor(rnd() * (y - x + 1)); }
function mescola(a) { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function sceltaPesata(pesi) {
  const voci = Object.entries(pesi).filter(([, p]) => p > 0);
  let tot = voci.reduce((s, [, p]) => s + p, 0), v = rnd() * tot;
  for (const [k, p] of voci) { v -= p; if (v <= 0) return k; }
  return voci.length ? voci[voci.length - 1][0] : null;
}

// ── anti-ripetizione ──
let contaUso = {}, azioniRecenti = [];
function azzeraUsi() { contaUso = {}; azioniRecenti = []; }
function disponibile(testo) { return (contaUso[testo] || 0) < MAX_USI_TESTO; }
function registraUso(testo, azione) {
  contaUso[testo] = (contaUso[testo] || 0) + 1;
  if (azione) { azioniRecenti.push(azione); if (azioniRecenti.length > RECENZA_AZIONE) azioniRecenti.shift(); }
}
function azioneRecente(azione) { return azioniRecenti.includes(azione); }
// sceglie da una lista evitando ciò che è già stato usato troppo (come nel base)
function scegliDisponibile(lista) {
  const validi = lista.filter(disponibile);
  return validi.length ? r(validi) : lista.reduce((a, b) => (contaUso[a] || 0) <= (contaUso[b] || 0) ? a : b);
}

// ── parole ──
function maiuscola(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function minuscola(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
function nomi(lista) {
  const p = lista.slice().sort((a, b) => a - b).map(x => NUM_PAROLE[x]);
  return maiuscola(p.length === 1 ? p[0] : p.slice(0, -1).join(", ") + " e " + p[p.length - 1]);
}
function N(x) { return maiuscola(NUM_PAROLE[x]); }
function n(x) { return NUM_PAROLE[x]; }
function volteTesto(k) { return k === 1 ? "una volta" : CIFRE[k] + " volte"; }
function secondiTesto(k) { return k === 1 ? "un secondo" : CIFRE[k] + " secondi"; }
function stimaParlato(testo, rate) { return testo.split(/\s+/).length / (PAROLE_AL_SECONDO * (rate || 1)) + 0.5; }

// ───── core/manichino.js ─────
// ════════════════════════════════════════════════════════════
// IL MANICHINO DIGITALE — ORDINATO
// Per ogni numero il software tiene la rappresentazione di ciò che la
// macchina ha ordinato (non di ciò che i corpi reali fanno: non c'è
// camera, non c'è rilevamento). Il manichino esegue ogni ordine alla
// lettera, con precisione perfetta e nei tempi dichiarati.
// ════════════════════════════════════════════════════════════

// cinque canali indipendenti
const CANALI = ["gambe", "busto", "braccioDx", "braccioSx", "testa"];
const STATI = { FERMO: "FERMO", MOVIMENTO: "IN_MOVIMENTO", TENUTO: "GESTO_TENUTO" };
const LIVELLI_A_TERRA = ["seduto", "supino", "prono", "fianco"];
const LIVELLI = ["in_piedi", "in_ginocchio"].concat(LIVELLI_A_TERRA);

// ── anatomia: articolazioni (gradi) con limiti reali ──
// convenzioni: abduzione/flessione positive; il gomito non va oltre 0 (niente iperestensione)
const LIMITI = {
  collo: [-50, 60], testaInclina: [-40, 40], testaRuota: [-80, 80],
  col1F: [-15, 40], col1L: [-25, 25], col2F: [-15, 40], col2L: [-25, 25], col3F: [-10, 35], col3L: [-20, 20],
  spallaDxA: [0, 180], spallaDxF: [-50, 180], gomitoDx: [0, 150], polsoDx: [-70, 70],
  spallaSxA: [0, 180], spallaSxF: [-50, 180], gomitoSx: [0, 150], polsoSx: [-70, 70],
  bacinoR: [-45, 90], ancaDxA: [-20, 60], ancaDxF: [-20, 125], ancaSxA: [-20, 60], ancaSxF: [-20, 125],
  ginocchioDx: [0, 145], ginocchioSx: [0, 145], cavigliaDx: [-45, 25], cavigliaSx: [-45, 25],
  quota: [-0.9, 0.5],        // altezza del bacino rispetto alla posizione in piedi (unità: lunghezza gamba)
  giaciuto: [-90, 90]        // inclinazione del corpo intero: 0 in piedi, ±90 disteso
};
const GIUNTI_PER_CANALE = {
  gambe: ["bacinoR", "ancaDxA", "ancaDxF", "ancaSxA", "ancaSxF", "ginocchioDx", "ginocchioSx", "cavigliaDx", "cavigliaSx", "quota", "giaciuto"],
  busto: ["col1F", "col1L", "col2F", "col2L", "col3F", "col3L"],
  braccioDx: ["spallaDxA", "spallaDxF", "gomitoDx", "polsoDx"],
  braccioSx: ["spallaSxA", "spallaSxF", "gomitoSx", "polsoSx"],
  testa: ["collo", "testaInclina", "testaRuota"]
};
const POSA_NEUTRA = {};
Object.keys(LIMITI).forEach(k => { POSA_NEUTRA[k] = 0; });
POSA_NEUTRA.spallaDxA = POSA_NEUTRA.spallaSxA = 8;
// pose dei livelli (solo le gambe e l'inclinazione del corpo)
const POSE_LIVELLO = {
  in_piedi:     { quota: 0, giaciuto: 0, ancaDxF: 0, ancaSxF: 0, ginocchioDx: 0, ginocchioSx: 0 },
  in_ginocchio: { quota: -0.45, giaciuto: 0, ancaDxF: 0, ancaSxF: 0, ginocchioDx: 90, ginocchioSx: 90 },
  seduto:       { quota: -0.62, giaciuto: 0, ancaDxF: 90, ancaSxF: 90, ginocchioDx: 60, ginocchioSx: 60 },
  supino:       { quota: -0.9, giaciuto: 90, ancaDxF: 0, ancaSxF: 0, ginocchioDx: 0, ginocchioSx: 0 },
  prono:        { quota: -0.9, giaciuto: -90, ancaDxF: 0, ancaSxF: 0, ginocchioDx: 0, ginocchioSx: 0 },
  fianco:       { quota: -0.9, giaciuto: 90, bacinoR: 90, ancaDxF: 30, ancaSxF: 30, ginocchioDx: 40, ginocchioSx: 40 }
};
function blocca(posa) {
  const p = {};
  for (const k in posa) { const l = LIMITI[k]; p[k] = l ? Math.max(l[0], Math.min(l[1], posa[k])) : posa[k]; }
  return p;
}

// ── zone e coordinate: quadrato 0–1, lato A in basso (y=1), B a destra, C in alto, D a sinistra ──
function puntoSulLato(lato, punto, distanza) {
  const d = distanza || 0.08;
  if (lato === "A") return { x: punto, y: 1 + d };
  if (lato === "B") return { x: 1 + d, y: 1 - punto };
  if (lato === "C") return { x: 1 - punto, y: -d };
  return { x: -d, y: punto };
}
function direzioneVerso(lato) { return { A: 0, B: 90, C: 180, D: 270 }[lato]; }

// ════════════════════════════════════════════════════════════
// STATO DEI CORPI
// ════════════════════════════════════════════════════════════
let corpi = {};          // numero → corpo
let ORA = 0;             // tempo dell'ultima interrogazione
let TRANSIZIONI = [];    // ogni cambio di stato, per il log
let APPROSSIMATE = {};   // azioni senza pose-chiave, animate in modo approssimato

function canaleVuoto(t) { return { stato: STATI.FERMO, da: t, azione: null, fine: t, loop: false, tieniFino: null, durRip: 0 }; }
function creaCorpo(n) {
  const canali = {}; CANALI.forEach(c => { canali[c] = canaleVuoto(0); });
  return { n, presente: false, zona: "fuori", x: 0.5, y: 1.05, dir: 0, lato: "A", punto: null,
    livello: "in_piedi", livelloDa: 0, livelloFine: 0, canali, stato: STATI.FERMO, statoDa: 0,
    posa: Object.assign({}, POSA_NEUTRA), anim: {}, mov: null,

const CINQUE = 5;

// in quale zona deve stare un corpo per ricevere un'azione di questa famiglia

// perché un corpo NON può ricevere quest'azione (null = può)

      return def.ammessi && !def.ammessi.includes(c.livello) ? { tipo: "livello", serve: "in_piedi" } : null;

  if (def.fermo && !def.stasiVoluta && èFermo(n) && fermoDa(n) > FERMO_MASSIMO) return { tipo: "fermo da troppo" };

    return { tipo: "livello-no" };
  }
  if (richiede === "aTerra" && !èATerra(n)) return n !== CINQUE ? { tipo: "livello", serve: "a_terra" } : { tipo: "livello-no" };
  if (richiede === "inPiedi" && !èInPiediStabile(n)) return { tipo: "in transizione" };   // si salta solo da in piedi, già arrivati
  return null;
}

// ── intestazioni: "Numero tre." / "Tutti:" / "Uno e tre:" ──
function insiemeDiRiferimento(def) { return def.cat === "fuori" ? presenti().filter(x => corpi[x].zona === "pubblico") : dentroQuadrato(); }
function intestazione(dest, def, breve) {
  const rif = insiemeDiRiferimento(def);

  if (dest.length === 1) return breve ? N(dest[0]) + "." : "Numero " + n(dest[0]) + ".";
  if (dest.length === rif.length && rif.length > 1) return "Tutti:";

// testo dell'azione, con i segnaposti
function riempi(testo, par) {
  return testo.replace("{N}", secondiTesto(par.N || 5)).replace("{q}", par.q || "lentamente")
    .replace("{L}", par.L || "A").replace("{X}", par.X ? n(par.X) : "uno");

// ── posizioni (effetto "dove") ──
function limita(v) { return Math.max(0.05, Math.min(0.95, v)); }

function direzioneTra(da, a) { return (Math.atan2(-(a.x - da.x), a.y - da.y) * 180 / Math.PI + 360) % 360; }

    else if (tipo === "diagonale") p = { x: 0.2 + i * (0.6 / Math.max(1, k - 1)), y: 0.2 + i * (0.6 / Math.max(1, k - 1)) };

  if (def.scambio && dest.length === 2) {

  }

// ════════════════════════════════════════════════════════════
// COSTRUIRE UN ORDINE
// opz: { par: {N, q, L, X}, breve (intestazione corta, raffica), ruoli {n:"a"|"b"},
//        coppia [a,b], contro {altri, x}, testo (frase già pronta, per Archivi e finale),
//        canaliPer {n: [...]}, posizioni {n: {...}}, classe, attesa, durata, rate }

function costruisci(def, dest, opz) {
  opz = opz || {};

  if (!par.q) par.q = r(QUALITA);
  if (!par.L) par.L = r(LATI);
  const o = { azione: def.id, cat: def.cat, destinatari: dest.slice().sort((a, b) => a - b), ruoli: opz.ruoli || {}, par,
    canaliPer: {}, posizioni: {}, livelloPer: {}, fermo: !!def.fermo, stasiVoluta: !!def.stasiVoluta, classe: opz.classe || def.cat };
  // ripetizioni e tempi
  let rip = 0, durata = def.dur ?? DURATA_GESTO_SEMPLICE, attesa = null, tieni = def.tieni, ciclo = null;

  if (def.sec) {
    if (def.tieni === "sec") { tieni = par.N; attesa = par.N + (def.dur || 0); }
    if (def.durSec) { durata = par.N; attesa = par.N; }
  }
  if (def.attesaFissa) attesa = def.attesaFissa;
  if (def.loop) { ciclo = def.ciclo || 2; durata = ciclo; }
  if (opz.durata !== undefined) durata = opz.durata;
  if (opz.attesa !== undefined) attesa = opz.attesa;
  o.rip = rip; o.durata = durata; o.attesaDichiarata = attesa; o.tieni = tieni ?? null; o.loop = !!def.loop;
  o.cicliAnim = def.cicli || 0;
  // canali e livello per ogni destinatario
  o.destinatari.forEach(x => {
    const ruolo = o.ruoli[x];
    o.canaliPer[x] = (opz.canaliPer && opz.canaliPer[x]) || (ruolo === "a" ? def.canaliA : ruolo === "b" ? def.canaliB : def.canali) || [];
    const liv = ruolo === "b" ? def.livelloB : (ruolo === "a" ? null : def.livello);

  if (def.gruppoContro && opz.contro) {

  if (def.entra) o.entra = true;

  const loopAttivi = o.destinatari.filter(x => corpi[x] && corpi[x].presente && CANALI.some(k => canaleInLoop(x, k)));

    if (disgiunti && opz.somma !== false && (opz.somma === true || rnd() < 0.5) && !def.fermo && !def.esce) o.modo = "somma";

  if (def.cat === "cinque" && !def.script && !opz.modo && o.destinatari.length === 1) {
    const x = o.destinatari[0];
    const inLoop = corpi[x] && corpi[x].presente ? CANALI.filter(k => canaleInLoop(x, k)) : [];
    const stesso = inLoop.some(k => o.canaliPer[x].includes(k));

    let corpo = riempi((plurale ? def.p : def.s) || def.p || def.s, par);

  }
  if (def.frase && !opz.testo && o.basta) o.frase = "Basta. " + o.frase;
  if (typeof VERSIONE !== "undefined" && VERSIONE.senzaTutti) o.frase = formaDieci(o.frase);   // partita da 10 minuti: mai "Tutti", i numeri come "Due. …"

// violazioni di un ordine rispetto allo stato attuale del manichino (vuoto = valido)
function violazioni(o) {
  const def = AZIONI[o.azione];

  const v = [];
  o.destinatari.forEach(x => { const m = motivoNo(def, x, o.ruoli[x]); if (m) v.push(N(x) + ": " + m.tipo); });
  const quanti = def.cat === "fuori" ? presenti().length : dentroQuadrato().length;
  if (def.min && quanti < def.min && def.cat !== "chiamata" && !def.script) v.push("servono " + def.min + " corpi");
  return v;

// ── ordine preparatorio: "Rialzati." / "A terra." ──
function preparatorio(serve, dest) {
  const fuori = dest.every(x => corpi[x].zona === "pubblico");
  const def = serve === "in_piedi" ? (fuori ? AZIONI.f_alzati : AZIONI.r_rialzatevi) : AZIONI.supini;
  const o = costruisci(def, dest, { classe: "preparatorio", somma: false });
  o.preparatorio = true;
  return o;

// ════════════════════════════════════════════════════════════
// PROVARE UN'AZIONE: decide i destinatari possibili, inserisce il

// opz.esatti = i destinatari devono essere proprio questi (relazioni, coppie)

function prova(def, candidati, opz) {
  opz = opz || {};

  // partita.html: mai un'azione che lascia scegliere al corpo cosa fare, come o se muoversi
  if (typeof VERSIONE !== "undefined" && VERSIONE.vietaScelte && FORMULE_SCELTA.test((def.s || "") + " " + (def.p || "") + " " + (opz.testo || ""))) return null;

  if (typeof VERSIONE !== "undefined" && VERSIONE.dieci && !ammessoDieci(def, opz)) return null;
  const quanti = def.cat === "fuori" ? presenti().length : dentroQuadrato().length;
  if (def.min && quanti < def.min) return null;
  const ok = [], prep = {}, ruoli = opz.ruoli || {};
  let scartati = 0;
  candidati.forEach(x => {
    const m = motivoNo(def, x, ruoli[x]);
    if (!m) ok.push(x);
    else if (m.tipo === "livello" && opz.prep !== false && x !== CINQUE) (prep[m.serve] = prep[m.serve] || []).push(x);
    else scartati++;

  if (opz.esatti && daPreparare.length && Object.keys(prep).length > 1) return null;
  if (!ok.length && !daPreparare.length) return null;

}

// una versione può avere leve proprie (VERSIONE.leve: rateMassima, rafficaPicco, pausaPicco); altrimenti quelle comuni
// partita.html: nella parte 2 leve proprie (VERSIONE.leveParte2), così il picco dello sfinimento supera quello della parte 1

function pausaLeva(i) { return interpolaEsp(PAUSA_LENTA, leva("pausaPicco", PAUSA_PICCO), i); }
function quotaRaffica(i) { return leva("rafficaPicco", RAFFICA_PICCO) * Math.pow(sopraSoglia(i), CURVA_RAFFICA); }

const DURATA_PEZZO_STIMATA = { frase: 60, canone: 45, contrario: 45, livello: 55, qualita: 60, accumulo: 70, assolo: 55, duetto: 55, traversata: 35 };
const VARIAZIONI = ["canone", "contrario", "livello", "qualita", "accumulo", "assolo", "duetto", "traversata", "traversata"];

function generaDanze(t, tent) {
  const seg = R.seg;
  if (!corpiInScena().length) return null;
  if (!seg.pezzo.length) {
    const resta = limiteOra() - t;
    let tipo;
    if (!seg.frase || seg.usiFrase >= FRASE_USI_MAX) tipo = "frase";
    else {
      // la variazione meno usata, mai la stessa di prima
      const conta = k => seg.tipi.filter(x => x === k).length;
      tipo = mescola(VARIAZIONI.filter(k => k !== seg.tipi[seg.tipi.length - 1])).sort((a, b) => conta(a) - conta(b))[0];
      if (!seg.tipi.includes("assolo") && t > seg.t0 + 150) tipo = "assolo";   // almeno un assolo improvvisato per partita
      if (tipo !== "assolo" && tipo !== "duetto") seg.usiFrase++;
    }
    // poco tempo prima delle 18:00: traversate brevi finché stanno; fermi ad ascoltare solo negli ultimi secondi
    if (resta < DURATA_PEZZO_STIMATA[tipo] + 5 && resta > 22) tipo = "traversata";
    if (resta < DURATA_PEZZO_STIMATA[tipo] + 5) {
      // in coda: tutti fermi ad ascoltare, fino alle 18:00
      if (seg.ascolto) return null;
      seg.ascolto = true;
      return [costruisci(AZIONI.danza_ascolta, corpiInScena(), { testo: "Tutti: fermi. Ascoltate.", classe: "danza" }), { attesa: Math.max(0.5, resta - 6) }];
    }
    seg.tipi.push(tipo);
    seg.pezzo = PEZZI_DANZA[tipo](seg);
    // lo spazio cambia a ogni pezzo: prima del pezzo, una nuova formazione oppure una traversata precisa
    // (la traversata è già un cambio di spazio)
    if (tipo !== "traversata") { if (rnd() < 0.35) seg.pezzo.unshift(cambioSpazio); else seg.pezzo.unshift(...PEZZI_DANZA.traversata(seg)); }
  }
  if (seg.pezzo[0] === cambioSpazio) { const p = inPiediPrima(corpiInScena()); if (p) return p; }
  return seg.pezzo.shift()(t);
}

// peso di una famiglia: trapezio [inizio, pieno, fine del pieno, fine] in secondi dall'inizio della parte 2

  if (tp > f[2]) return (f[3] - tp) / Math.max(1, f[3] - f[2]);

  // ── nessun corpo lasciato fermo troppo a lungo ──
  const voce = stimaParlato(frase, rateOra(t));
  // (basta che la battuta rimetta in movimento almeno uno di chi è fermo da troppo: pretendere tutti bloccherebbe la voce
  // dopo un silenzio, e i corpi resterebbero fermi ancora più a lungo; gli altri arrivano con le battute successive)
  const fermi = fermiDaRiattivare(t, MAX_FERMO_GRUPPO - voce), lasciati = fermi.filter(x => !dest.includes(x));
  if (fermi.length && lasciati.length === fermi.length) return { motivo: "lascia fermo: " + lasciati.map(n).join(", ") + " da " + fermoDa(lasciati[0]).toFixed(0) + " s" };
  // ── l'ordine ──
  const canali = [...new Set(b.canali.concat(cp.pose ? Object.keys(cp.pose) : []).concat(liv ? ["gambe"] : []))];
  const def = entra ? AZIONI.gen_entra : esce ? AZIONI.gen_esci : AZIONI.gen;
  const posizioni = {};
  if (sp && !esce) dest.forEach((x, k) => {
    const punto = Math.max(0.1, Math.min(0.9, (+sp.punto || 0.5) + (k - (dest.length - 1) / 2) * 0.12));
    const q = puntoSulLato(sp.lato, punto, -0.12);
    posizioni[x] = { x: limita(q.x), y: limita(q.y), zona: "dentro", dir: entra ? direzioneTra(q, { x: 0.5, y: 0.5 }) : direzioneTra(posizioneAl(x, t), q) };
  });
  const canaliPer = {}; dest.forEach(x => { canaliPer[x] = canali; });
  const breve = !("durata" in b);
  let durata = Math.max(0, Math.min(30, +b.durata || (breve ? 2 : 3)));
  if (arresto) durata = 0;
  const o = costruisci(def, dest, { testo: frase, classe: "modello", canaliPer, posizioni, durata, modo: b.modo === "somma" ? "somma" : "sostituisce" });
  o.attesaDichiarata = null;   // la pausa dopo la voce la decidono le leve di velocità, non il modello
  o.loop = !!b.loop && !arresto;
  if (o.loop) o.durata = Math.max(1, durata || 2);
  o.rip = Number.isInteger(b.ripetizioni) && b.ripetizioni > 0 && !o.loop ? b.ripetizioni : 0;
  if (liv) dest.forEach(x => { if (corpi[x].livello !== liv) o.livelloPer[x] = liv; });
  if (cp.pose) { o.posePer = {}; dest.forEach(x => { o.posePer[x] = cp.pose; }); }
  o.fermo = arresto; o.stasiVoluta = arresto;
  const gen = { richiesta: v.idRichiesta, secondi: v.secondi, modello: v.modello, tipo: arresto ? "arresto" : viso ? "viso" : "altro",
    intenzione: typeof b.intenzione === "string" ? b.intenzione : null, testoModello: b.testo,
    poseModello: b.pose || null, poseCorrette: cp.corrette.length ? cp.pose : null, correzioniPose: cp.corrette, correzioni, senzaPose: !cp.pose };
  if (b._finto_errore) gen.erroreVoluto = b._finto_errore;
  o.gen = gen; o.genV = v;
  o.allaVoce = () => {
    if (viso) G.viso++;
    dest.forEach(x => { if (arresto) G.voluti[x] = true; else delete G.voluti[x]; });
    if (arresto) G.stop++;
    if (!p1 && dest.length === 1 && !G.presentati.includes(dest[0])) G.presentati.push(dest[0]);
  };
  return { o, extra: { origine: "modello", gen } };
}

// un passo della struttura scritta (tenute, prese, abbandono) dentro una parte generata: nel log è "scritto"
function comeScritto(ris) {
  if (!ris) return ris;
  const [o, e] = Array.isArray(ris) ? ris : [ris, {}];
  return [o, Object.assign({}, e, { origine: "scritto" })];
}

    pose: g.poseModello, poseCorrette: g.poseCorrette || undefined, correzioniPose: g.correzioniPose.length ? g.correzioniPose : undefined,
    poseApprossimate: g.senzaPose || undefined };
}
function statisticheGen() {
  const G = R && R.gen;
  if (!G) return null;
  const fatte = G.richieste.filter(x => x.arrivo !== undefined && !x.errore && x.secondi !== null);
  const scartePerMotivo = {};
  G.scarti.forEach(s => { const k = s.motivo.replace(/[:(«].*$/, "").trim(); scartePerMotivo[k] = (scartePerMotivo[k] || 0) + 1; });
  return {
    modo: G.attivo ? "generativo locale" : "combinatorio", modello: G.modello, richieste: G.richieste.length, risposte: fatte.length,
    errori: G.richieste.filter(x => x.errore).length,
    secondiMediPerRichiesta: fatte.length ? +(fatte.reduce((s, x) => s + x.secondi, 0) / fatte.length).toFixed(1) : null,
    secondiMassimi: fatte.length ? Math.max(...fatte.map(x => x.secondi)) : null,
    codeVuote: G.vuote.length + (G.vuotaDa !== null ? 1 : 0), secondiACodaVuota: +G.vuote.reduce((s, x) => s + x.secondi, 0).toFixed(1),
    dalModello: G.dalModello, dalCombinatorio: G.combinatorio, scartate: G.scarti.length, scartatePerMotivo: scartePerMotivo,
    arresti: G.stop, dettagliViso: G.viso, inCoda: G.coda.length, avviso: G.avviso
  };
}
function datiGenerativo() {
  const G = R && R.gen;
  if (!G) return null;
  return { nota: "Il seed vale solo per il meccanismo combinatorio: con il modello la stessa partita non si ripete.",
    riepilogo: statisticheGen(), richieste: G.richieste, codaVuota: G.vuote, scartate: G.scarti, eventi: G.eventi };
}

// ════════════════════════════════════════════════════════════
// MODELLO FINTO — risponde come il modello locale, senza Ollama:
// battute prefissate scelte con un seed proprio (non tocca il caso della
// regia), anche sbagliate di proposito, con un ritardo regolabile.
// Usato dai test (test/simula_gen.js) e dalla pagina con ?modello=finto
// (&ritardo=veloce|lento|assente &errori=0.25).
// Ogni battuta sbagliata porta _finto_errore: il motore deve scartarla
// (tranne "angolo", che va riportato ai limiti e accettato).
// ════════════════════════════════════════════════════════════

const RITARDI_FINTI = { veloce: [2, 6], lento: [25, 60] };
// p = plurale (a tutti o a più numeri), s = singolare; {L} un lato
const FINTE = [
  { p: "spostate il peso sul piede sinistro, lentamente", s: "sposta il peso sul piede sinistro, lentamente", canali: ["gambe"], pose: { gambe: [{ f: 1, p: { ancaSxF: 10, ginocchioSx: 20 } }] } },
  { p: "spirale dallo sterno verso il lato {L}", s: "spirale dallo sterno verso il lato {L}", canali: ["busto", "testa"], pose: { busto: [{ f: 1, p: { col1L: 20, col2L: 15 } }], testa: [{ f: 1, p: { testaRuota: 50 } }] } },
  { p: "lasciate cadere le braccia e recuperatele", s: "lascia cadere le braccia e recuperale", canali: ["braccioDx", "braccioSx"], rip: 2 },
  { p: "scivolate verso il lato {L}", s: "scivola verso il lato {L}", canali: ["gambe"], spostamento: true },
  { p: "il movimento parte dal bacino, cerchi larghi", s: "il movimento parte dal bacino, cerchi larghi", canali: ["gambe", "busto"], loop: true },
  { p: "sospendete il braccio destro, poi rilasciatelo", s: "sospendi il braccio destro, poi rilascialo", canali: ["braccioDx"], pose: { braccioDx: [{ f: 0.6, p: { spallaDxF: 150 } }, { f: 0.4, p: { spallaDxF: 0 } }] } },
  { p: "tensione nelle mani, controtensione nei gomiti", s: "tensione nelle mani, controtensione nei gomiti", canali: ["braccioDx", "braccioSx"] },
  { p: "traiettoria in diagonale, sostenuta, verso il lato {L}", s: "traiettoria in diagonale, sostenuta, verso il lato {L}", canali: ["gambe"], spostamento: true },
  { p: "il peso cade in avanti: recuperatelo con un passo", s: "il peso cade in avanti: recuperalo con un passo", canali: ["gambe", "busto"] },
  { p: "la testa ruota verso il lato {L}, sospesa", s: "la testa ruota verso il lato {L}, sospesa", canali: ["testa"] },
  { p: "scendete in ginocchio, il peso basso", s: "scendi in ginocchio, il peso basso", canali: ["gambe"], livello: "in_ginocchio" },
  { p: "tornate in piedi partendo dal bacino", s: "torna in piedi partendo dal bacino", canali: ["gambe", "busto"], livello: "in_piedi" },
  { p: "a terra, sul fianco, pesanti", s: "a terra, sul fianco, pesante", canali: ["gambe", "busto"], livello: "fianco" },
  { p: "contrappeso con chi è più vicino", s: "contrappeso con chi è più vicino", canali: ["gambe", "braccioDx"], minimo: 2 },
  { p: "gli occhi chiusi", s: "gli occhi chiusi", canali: ["testa"], tipo: "viso" },
  { p: "fermi", s: "fermo", canali: ["gambe", "busto", "braccioDx", "braccioSx", "testa"], tipo: "arresto", durata: 0 }
];
const BREVI_FINTE = ["peso a destra", "spirale", "rilascio", "giù", "su", "sterno avanti", "bacino", "sospesi", "cadete", "recuperate", "pesanti", "leggeri", "a scatti", "verso il lato {L}"];
const ERRORI_FINTI = ["giunto", "angolo", "tutti", "scelta", "vietata", "lunga", "numero_parte1", "precondizione", "formato", "assente"];

function rispostaFinta(req, rng, opz) {
  opz = opz || {};
  const quale = a => a[Math.floor(rng() * a.length)];
  const modo = opz.ritardo || "veloce";
  const quotaErrori = opz.errori ?? 0.25;
  if (modo === "assente") return { ritardo: TIMEOUT_MODELLO, risposta: { errore: "tempo scaduto" } };
  const [r0, r1] = RITARDI_FINTI[modo] || RITARDI_FINTI.veloce;
  const ritardo = r0 + rng() * (r1 - r0);
  if (rng() < quotaErrori * 0.15) return { ritardo, risposta: { errore: "JSON non valido", secondi: ritardo } };
  const st = req.stato, sn = st.senza_numeri;
  const inScena = st.corpi.filter(c => c.zona === "nel quadrato");
  const fuori = st.corpi.filter(c => c.zona === "fuori scena" || c.zona === "tra il pubblico");
  const da = (Array.isArray(st.da_riattivare) ? st.da_riattivare : []).filter(x => inScena.some(c => c.numero === x));
  const battute = [];
  for (let k = 0; k < req.quante; k++) {
    // chi: chi va riattivato per primo; nella parte 1 sempre a tutti
    let dest;
    if (sn || rng() < 0.4 || inScena.length < 2) dest = "tutti";
    else if (da.length && k === 0) dest = da.slice();
    else { const m = inScena.map(c => c.numero); for (let i = m.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [m[i], m[j]] = [m[j], m[i]]; } dest = m.slice(0, 1 + Math.floor(rng() * Math.min(2, m.length))).sort(); }
    const ds = dest === "tutti" ? inScena : inScena.filter(c => dest.includes(c.numero));
    const L = quale(["A", "B", "C", "D"]);
    let f = quale(FINTE.filter(x => !x.livello || ds.every(c => c.livello !== x.livello)).filter(x => !x.minimo || ds.length >= x.minimo));
    let testo = req.breve ? quale(BREVI_FINTE) : (dest !== "tutti" && dest.length === 1 ? f.s : f.p);
    testo = testo.replace("{L}", L);
    if (!req.breve && !f.tipo && rng() < 0.6) testo += ", " + quale(["sostenuto", "percussivo", "sospeso", "pesante", "leggero"]);
    const testa = dest === "tutti" ? "" : nomi(dest) + ". ";
    const b = { destinatari: dest, testo: testa + maiuscola(testo) + ".", canali: f.canali.slice(), tipo: f.tipo || "altro" };
    if (req.breve) b.canali = [quale(["gambe", "busto", "braccioDx", "testa"])];
    else Object.assign(b, { modo: rng() < 0.5 ? "somma" : "sostituisce", durata: f.durata ?? 2 + Math.floor(rng() * 5), ripetizioni: f.rip || null, loop: !!f.loop,
      livello_finale: f.livello || null, spostamento: f.spostamento ? { lato: L, punto: +rng().toFixed(2), fuori: false } : null,
      pose: f.pose || {}, intenzione: "battuta finta n. " + (k + 1) });
    // entrate (parte 2): chi è fuori scena rientra
    if (!sn && fuori.length && k === 0 && rng() < 0.5) {
      const x = fuori[0].numero;
      Object.assign(b, { destinatari: [x], testo: N(x) + ". Entra dal lato " + L + ".", canali: ["gambe"], tipo: "altro" });
      if (!req.breve) Object.assign(b, { spostamento: { lato: L, punto: 0.5, fuori: false }, livello_finale: null, pose: {} });
      else b.spostamento = { lato: L, punto: 0.5, fuori: false };
    }
    // sbagliate di proposito
    if (rng() < quotaErrori) {
      const e = quale(ERRORI_FINTI);
      b._finto_errore = e;
      if (e === "giunto") b.pose = { braccioDx: [{ f: 1, p: { gomitoX: 40 } }] };
      else if (e === "angolo") { b.pose = { braccioDx: [{ f: 1, p: { gomitoDx: 200, spallaDxF: -90 } }] }; b.canali = ["braccioDx"]; }
      else if (e === "tutti") b.testo = "Tutti: giù.";
      else if (e === "scelta") b.testo = (dest === "tutti" ? "" : testa) + "Come volete, verso il centro.";
      else if (e === "vietata") b.testo = (dest === "tutti" ? "" : testa) + "Muovetevi come " + "danza" + "tori.";
      else if (e === "lunga") b.testo = (dest === "tutti" ? "" : testa) + "Spostate il peso molto lentamente da un piede all'altro e intanto guardate il soffitto, poi il pavimento, poi di nuovo il soffitto, e ancora il pavimento.";
      else if (e === "numero_parte1") { if (sn) { b.destinatari = "tutti"; b.testo = "Uno. Spirale."; } else { b.destinatari = [7]; } }
      else if (e === "precondizione") {
        const c = inScena[0];
        if (c && LIVELLI_A_TERRA.includes(c.livello)) { b.destinatari = sn ? "tutti" : [c.numero]; b.testo = (sn ? "Saltate" : N(c.numero) + ". Salta") + " sul posto."; }
        else if (c) { b.destinatari = sn ? "tutti" : [c.numero]; b.testo = (sn ? "Restate in piedi" : N(c.numero) + ". Resta in piedi") + "."; b.livello_finale = c.livello; if (!("durata" in b)) b.durata = 2; }
      }
      else if (e === "formato") b.canali = ["piede"];
      else if (e === "assente") { if (fuori.length) { b.destinatari = [fuori[0].numero]; b.testo = N(fuori[0].numero) + ". Spirale."; b.spostamento = null; } else b.canali = []; }
    }
    battute.push(b);
  }
  return { ritardo, risposta: { battute, secondi: +ritardo.toFixed(2), modello: "finto" } };
}

// VISTA DIMOSTRAZIONE (solo nella pagina). Mostra il manichino ORDINATO:
// ciò che la voce ha ordinato, eseguito alla lettera. Non c'è camera,
// non c'è rilevamento: è la rappresentazione dell'ordine.
//   palco dall'alto: quadrato A–D, pubblico intorno, cerchi numerati con freccia

//   righe di stato: livello, stato di moto, secondi
// ════════════════════════════════════════════════════════════

const COLORI = { linea: "#e8e8e8", tenue: "#6a6a6a", pubblico: "#2e2e2e", movimento: "#ffffff", tenuto: "#9a9a9a", fermo: "#000000", cinque: "#d9b25f", approssimata: "#c77" };

  portato: "in braccio", sollevato: "sulla schiena", portato_prono: "sulle spalle", steso_alto: "steso sopra", capovolto: "a testa in giù", capovolto_alto: "a testa in giù, in alto" };
const NOMI_STATO = { FERMO: "FERMO", IN_MOVIMENTO: "IN MOVIMENTO", GESTO_TENUTO: "GESTO TENUTO" };

  return { g, w, h };
}

// ── palco dall'alto ──
function disegnaPalco(cv, t) {
  const { g, w, h } = preparaCanvas(cv);
  g.clearRect(0, 0, w, h);
  const lato = Math.min(w, h) * 0.6, ox = (w - lato) / 2, oy = (h - lato) / 2;
  const P = (x, y) => [ox + x * lato, oy + y * lato];

  const pub5 = R && R.V.quinto && R.cinque.stato === "attivo";
  g.fillStyle = pub5 ? COLORI.cinque : COLORI.pubblico;

    const s = (k + 0.5) / 14, d = 0.13 + fila * 0.07;

  [["A", 0.5, 1.045], ["B", 1.045, 0.5], ["C", 0.5, -0.045], ["D", -0.045, 0.5]].forEach(([L, x, y]) => { const [px, py] = P(x, y); g.fillText(L, px, py); });
  if (pub5) { g.fillStyle = COLORI.cinque; g.font = "bold " + Math.round(lato * 0.045) + "px system-ui, sans-serif"; const [px, py] = P(0.5, 1.3); g.fillText("5 · il pubblico", px, py); }

    if (c.n === CINQUE) return;   // il cinque è il pubblico: si vede nella fascia intorno
    const pos = posizioneAl(c.n, t), [px, py] = P(pos.x, pos.y), rr = lato * 0.04;

// ── manichino frontale: cinematica semplice in 3D, proiettata di fronte ──
const RAD = Math.PI / 180;

function disegnaManichini(cv, t) {

// LOG (solo nella pagina): esportazione JSON e percentuali finali.
// Il log contiene, per ogni ordine: tempo, frase, stato prima/dopo dei
// destinatari; e ogni cambio di stato del manichino (TRANSIZIONI).
// ════════════════════════════════════════════════════════════

function percentualiCorpo(n) {
  const c = corpi[n], p = c.stat.presente || 0, pc = x => p ? Math.round(1000 * x / p) / 10 : 0;
  return { numero: n, secondiInScena: Math.round(p), aTerra: pc(c.stat.aTerra), fermo: pc(c.stat.FERMO), inMovimento: pc(c.stat.IN_MOVIMENTO), gestoTenuto: pc(c.stat.GESTO_TENUTO) };
}
function datiLog() {
  aggiorna(tempoPartita());
  return {
    versione: VERSIONE.nome, titolo: VERSIONE.titolo + " — " + VERSIONE.sottotitolo, seed: R.seed, corpi: R.N,
    scenarioRottura: R.scenario, durataRottura: R.Drottura, tempiDelleFasi: R.tempi,
    nota: "Il manichino è ORDINATO: rappresenta ciò che la voce ha ordinato, non ciò che i corpi hanno fatto.",
    ordini: R.log, transizioni: TRANSIZIONI,
    azioniApprossimate: APPROSSIMATE,
    percentuali: R.numeri.map(percentualiCorpo),
    percentualiCinque: VERSIONE.quinto && corpi[CINQUE].stat.presente > 0 ? percentualiCorpo(CINQUE) : null,
    // partita.html: il generativo locale (richieste, coda vuota, battute scartate e perché). Il seed vale solo per il combinatorio
    generativo: datiGenerativo()
  };
}
async function esportaLog() {
  if (!R) return;
  const blob = new Blob([JSON.stringify(datiLog(), (k, v) => v === Infinity ? "infinito" : v, 2)], { type: "application/json" });
  const nome = "partita_" + VERSIONE.nome + (R.gen && R.gen.attivo ? "_generativo_" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") : "_seed" + R.seed) + "_corpi" + R.N + ".json";
  // pubblicata su claude.ai: il salvataggio passa dalla conferma del visualizzatore
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: nome, data: blob }); } catch (e) {} return; }
  // file locale offline: scaricamento diretto
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function tabellaPercentuali() {
  if (!R) return "";
  const riga = (p, nome) => "<tr><td>" + nome + "</td><td>" + p.secondiInScena + " s</td><td>" + p.aTerra + "%</td><td>" + p.fermo + "%</td><td>" + p.inMovimento + "%</td><td>" + p.gestoTenuto + "%</td></tr>";
  let h = "<table><tr><th>numero</th><th>in scena</th><th>a terra</th><th>fermo</th><th>in movimento</th><th>gesto tenuto</th></tr>";
  R.numeri.forEach(x => { h += riga(percentualiCorpo(x), N(x)); });
  if (VERSIONE.quinto && corpi[CINQUE].stat.presente > 0) h += riga(percentualiCorpo(CINQUE), "Cinque, il pubblico (a parte)");
  return h + "</table><p class='nota'>Percentuali del tempo in scena, secondo il manichino ORDINATO.</p>";
}

// ───── core/ui.js ─────
// ════════════════════════════════════════════════════════════
// INTERFACCIA (solo nella pagina): pulsanti, voce, orologio, conto alla
// rovescia "dieci … uno, Via", wake lock, parametri dell'indirizzo.
// Il motore è la regia (core/regia.js): qui si chiede la prossima battuta,
// la si dice, a fine voce la si applica, poi si aspetta l'attesa.
//
// Parametri dell'indirizzo (per le prove): ?seed=12345&corpi=3&demo=1
//   &avvio=auto (parte da sola) &accelera=20 (tempo 20 volte più veloce, audio muto)
//   &voce=simulata (nessuna sintesi vocale: la voce dura quanto la stima)
// ════════════════════════════════════════════════════════════

const PARAM = new URLSearchParams(location.search);
const ACCELERA = Math.max(1, Math.min(200, +PARAM.get("accelera") || 1));
const VOCE_SIMULATA = PARAM.get("voce") === "simulata" || !("speechSynthesis" in window);
let statoPagina = "pronto";               // pronto | conto | corsa | fermo | finito
let orologio = { base: 0, da: null };
let corrente = null, timerBattuta = null, paracadute = null, generazione = 0, restante = null;
let seedScelto = +PARAM.get("seed") || nuovoSeed();
let numCorpi = Math.max(2, Math.min(4, +PARAM.get("corpi") || 4));
let voceIt = null, wakeLock = null;

// ── generativo locale (partita.html): aperta da http://localhost (il server) parte in GENERATIVO LOCALE,
// aperta da file o da un indirizzo pubblicato parte in COMBINATORIO. ?modello=finto: il modello finto, senza server
// (&ritardo=veloce|lento|assente &errori=0.25)
const MODELLO_FINTO = PARAM.get("modello") === "finto";
const DAL_SERVER = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let generativoScelto = !!VERSIONE.generativo && (DAL_SERVER || MODELLO_FINTO);
let richiesteInVolo = [], statoServer = null, rngFinto = null;

function tempoPartita() { return orologio.da === null ? orologio.base : orologio.base + (performance.now() - orologio.da) / 1000 * ACCELERA; }
function inCorsa() { return statoPagina === "corsa"; }
function accelerazione() { return ACCELERA; }
const $ = id => document.getElementById(id);
const mmss = s => { s = Math.max(0, Math.floor(s)); return (s / 60 | 0) + ":" + String(s % 60).padStart(2, "0"); };

// ── voce ──
function scegliVoce() {
  if (VOCE_SIMULATA) return;
  const vs = speechSynthesis.getVoices();
  voceIt = vs.find(v => /^it[-_]IT$/i.test(v.lang) && /alice|federica|luca|elsa|google/i.test(v.name)) || vs.find(v => /^it/i.test(v.lang)) || null;
}
function parla(testo, rate, fine) {
  let fatto = false;
  const chiudi = () => { if (fatto) return; fatto = true; clearTimeout(paracadute); duck(false); fine(); };
  const stimaS = stimaParlato(testo, rate);
  if (VOCE_SIMULATA) { paracadute = setTimeout(chiudi, stimaS * 1000 / ACCELERA); return; }
  const u = new SpeechSynthesisUtterance(testo);
  u.lang = "it-IT"; if (voceIt) u.voice = voceIt; u.rate = rate || 1; u.pitch = 1; u.volume = 1;
  u.onend = chiudi; u.onerror = chiudi;
  duck(true);
  try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { chiudi(); return; }
  // se la sintesi non chiude, si va avanti comunque
  paracadute = setTimeout(chiudi, (stimaS + PARACADUTE_VOCE) * 1000);
}
function parlaBreve(testo) { if (VOCE_SIMULATA) return; const u = new SpeechSynthesisUtterance(testo); u.lang = "it-IT"; if (voceIt) u.voice = voceIt; u.rate = 1.05; try { speechSynthesis.speak(u); } catch (e) {} }

// ── generativo: le richieste al server (che parla con Ollama), oppure al modello finto ──
function inviaBattute(req) {
  const partita = R;
  const consegna = risp => { if (R === partita) riceviBattute(req.id, risp, tempoPartita()); };
  if (MODELLO_FINTO) {
    const f = rispostaFinta(req, rngFinto, { ritardo: PARAM.get("ritardo") || "veloce", errori: PARAM.get("errori") !== null ? +PARAM.get("errori") : 0.25 });
    setTimeout(() => consegna(f.risposta), f.ritardo * 1000 / ACCELERA);
    return;
  }
  const ctrl = new AbortController(), t0 = performance.now();
  richiesteInVolo.push(ctrl);
  const scadenza = setTimeout(() => ctrl.abort(), TIMEOUT_MODELLO * 1000);
  fetch("/api/battute", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req), signal: ctrl.signal })
    .then(r => r.json())
    .catch(() => ({ errore: ctrl.signal.aborted ? "tempo scaduto" : "il server locale non risponde" }))
    .then(risp => {
      clearTimeout(scadenza); richiesteInVolo = richiesteInVolo.filter(c => c !== ctrl);
      if (risp.secondi === undefined) risp.secondi = (performance.now() - t0) / 1000;
      // server o Ollama assenti: si riprova dopo qualche secondo, non in un giro stretto
      setTimeout(() => consegna(risp), risp.errore && risp.errore !== "tempo scaduto" ? 3000 : 0);
    });
}
function annullaRichieste() { richiesteInVolo.forEach(c => { try { c.abort(); } catch (e) {} }); richiesteInVolo = []; }
function opzioniRegia() {
  const o = { durataAudioFinale: isFinite(Audio_.el.finale.duration) ? Audio_.el.finale.duration : DURATA_AUDIO_FINALE_STIMATA };
  if (VERSIONE.generativo) {
    rngFinto = mulberry32(seedScelto * 7919 + 13);
    o.generativo = { attivo: generativoScelto, invia: inviaBattute, modello: MODELLO_FINTO ? "finto" : (statoServer && statoServer.modello) || "" };
  }
  return o;
}
function impostaGenerativo(on) {
  generativoScelto = on;
  if (R && R.gen) attivaGenerativo(on);
  $("modo").textContent = on ? "GENERATIVO LOCALE" : "COMBINATORIO";
  $("modo").classList.toggle("scelto", on);
  if (on && R && R.gen && statoPagina === "corsa") curaCoda(tempoPartita());
}
const NOMI_ORIGINE = { modello: "MODELLO", scritto: "SCRITTO", combinatorio: "COMBINATORIO" };
function mostraOrigine(testo) { if (VERSIONE.generativo) $("origine").textContent = testo; }

// ── il ciclo: battuta → voce → applica → attesa ──
function avanti() {
  if (statoPagina !== "corsa") return;
  clearTimeout(timerBattuta);
  const b = prossima(tempoPartita());
  aggiornaTesta();
  if (b.tipo === "fine") { finePartita(); return; }
  if (b.tipo === "silenzio") { mostraTesto("·", "silenzio"); mostraOrigine(b.motivo === "coda vuota" ? "CODA VUOTA" : ""); corrente = { b, fase: "attesa" }; attendi(b.durata); return; }
  if (b.tipo === "evento") { mostraOrigine("SCRITTO"); eseguiEvento(b); return; }
  if (b.eventoInizio && b.eventoInizio.nome === "fine_musica_archivio") fermaArchivio();
  // (partita da 10 minuti: la musica dell'Archivio entra con il suo nome e sfuma alla fine)
  if (b.eventoInizio && b.eventoInizio.nome === "musica_archivio") suonaArchivio(b.eventoInizio.suono, b.eventoInizio.durata / ACCELERA, b.eventoInizio.sfuma / ACCELERA);
  mostraOrigine(NOMI_ORIGINE[b.origine || "scritto"]);
  mostraTesto(b.ordine.frase, b.classe);
  corrente = { b, fase: "voce" };
  const g = generazione;
  parla(b.ordine.frase, b.rate, () => { if (g === generazione) fineVoce(b); });
}
function fineVoce(b) {
  if (!corrente || corrente.b !== b || statoPagina !== "corsa") return;
  applica(b, tempoPartita());
  if (b.evento && b.evento.nome === "musica_archivio") suonaArchivio(b.evento.suono, b.evento.durata / ACCELERA);
  corrente.fase = "attesa";
  attendi(b.attesa);
}
function attendi(s) {
  const g = ++generazione;
  if (corrente) corrente.fineAttesa = tempoPartita() + s;
  timerBattuta = setTimeout(() => { if (g === generazione) avanti(); }, Math.max(0, s) * 1000 / ACCELERA);
}
function eseguiEvento(b) {
  corrente = { b, fase: "evento" };
  const g = ++generazione;
  if (b.nome === "audio_finale") {
    mostraTesto("·", "silenzio");
    suonaAudioFinale(() => { if (g === generazione && statoPagina === "corsa") { applica(b, tempoPartita()); avanti(); } });
    return;
  }
  // il conto all'indietro parlato: una parola alla volta, in tempo
  if (b.nome === "countdown") {
    applica(b, tempoPartita()); corrente.fase = "attesa"; attendi(b.durata);
    const g2 = generazione, parole = b.parole || [], passo = b.durata / Math.max(1, parole.length);
    parole.forEach((w, i) => setTimeout(() => { if (g2 !== generazione || statoPagina !== "corsa") return; mostraTesto(w, "conto"); parlaBreve(w); }, i * passo * 1000 / ACCELERA));
    return;
  }
  if (b.nome === "dissolvenza") dissolviTutto((b.sfuma || b.durata) / ACCELERA);
  // un evento con la sua musica sintetizzata (l'improvvisazione muta della partita da 10 minuti)
  if (b.musica) suonaArchivio(b.musica.suono, b.musica.durata / ACCELERA);
  applica(b, tempoPartita());
  corrente.fase = "attesa";
  attendi(b.durata);
}

// ── pulsanti ──
function avviaConConto() {
  if (statoPagina !== "pronto") return;
  if (regoleInCorso || silenzioRegole) { fermaRegole(); clearInterval(silenzioRegole); silenzioRegole = null; regoleInCorso = false; statoRegole(); }   // AVVIA a mano ferma le regole
  sbloccaAudio(); scegliVoce();
  const s = +$("seed").value; if (s > 0) seedScelto = Math.floor(s);
  // la partita si prepara già durante il conto: in generativo la prima richiesta al modello parte adesso, 10 s prima del "Via"
  iniziaRegia(VERSIONE, numCorpi, seedScelto, opzioniRegia());
  if (genAttivo()) invia(0);
  statoPagina = "conto"; aggiornaPulsanti();
  let k = 10;
  $("conto").style.display = "flex"; $("conto-n").textContent = k; parlaBreve(CIFRE[k] === "una" ? "uno" : CIFRE[k]);
  const passo = Math.max(30, 1000 / ACCELERA);
  const iv = setInterval(() => {
    k--;
    if (k > 0) { $("conto-n").textContent = k; parlaBreve(k === 1 ? "uno" : CIFRE[k]); return; }
    clearInterval(iv);
    $("conto-n").textContent = "Via"; parlaBreve("Via.");
    setTimeout(() => { $("conto").style.display = "none"; avvia(); }, Math.max(30, 700 / ACCELERA));
  }, passo);
}
function avvia() {
  if (!R || R.avviata) iniziaRegia(VERSIONE, numCorpi, seedScelto, opzioniRegia());   // (di solito già preparata durante il conto)
  R.avviata = true;
  $("seed").value = seedScelto;
  orologio = { base: 0, da: performance.now() };
  statoPagina = "corsa"; corrente = null; restante = null;
  Audio_.muto = ACCELERA > 1;
  fermaSottofondo(0.1);
  clearInterval(window.__sottofondo); window.__sottofondo = setInterval(cicloSottofondo, 250);
  richiediWakeLock(); aggiornaPulsanti(); $("fine").style.display = "none";
  avanti();
}
function freeze() {
  if (statoPagina === "corsa") {
    orologio.base = tempoPartita(); orologio.da = null; statoPagina = "fermo";
    generazione++; clearTimeout(timerBattuta); clearTimeout(paracadute);
    try { speechSynthesis.cancel(); } catch (e) {}
    restante = corrente && corrente.fase === "attesa" ? Math.max(0, corrente.fineAttesa - orologio.base) : null;
    sospendiSottofondo(); mostraTesto("FREEZE", "pausa");
  } else if (statoPagina === "fermo") {
    orologio.da = performance.now(); statoPagina = "corsa"; riprendiSottofondo();
    if (corrente && corrente.fase === "voce") { const b = corrente.b, g = generazione; mostraTesto(b.ordine.frase, b.classe); parla(b.ordine.frase, b.rate, () => { if (g === generazione) fineVoce(b); }); }
    else if (corrente && corrente.fase === "evento" && corrente.b.nome === "audio_finale" && Audio_.alTermineFinale) { try { Audio_.el.finale.play(); } catch (e) {} }
    else if (restante !== null) { mostraTesto("·", "silenzio"); attendi(restante); }
    else avanti();
  }
  aggiornaPulsanti();
}
function salta() {
  if (statoPagina !== "corsa" || !corrente) return;
  generazione++; clearTimeout(timerBattuta); clearTimeout(paracadute);
  try { speechSynthesis.cancel(); } catch (e) {}
  // l'ordine detto (anche a metà) vale: passa al manichino, poi si va avanti senza attesa
  if (corrente.fase === "voce") applica(corrente.b, tempoPartita());
  if (corrente.fase === "evento" && corrente.b.nome === "audio_finale") { try { Audio_.el.finale.pause(); } catch (e) {} Audio_.alTermineFinale = null; applica(corrente.b, tempoPartita()); }
  corrente = null; avanti();
}
function reset(nuovo) {
  generazione++; clearTimeout(timerBattuta); clearTimeout(paracadute); clearInterval(window.__sottofondo);
  try { speechSynthesis.cancel(); } catch (e) {}
  annullaRichieste();
  fermaSottofondo(0.4); fermaRegole(); clearInterval(silenzioRegole); silenzioRegole = null; regoleInCorso = false; rilasciaWakeLock();
  if (nuovo) seedScelto = nuovoSeed();
  statoPagina = "pronto"; orologio = { base: 0, da: null }; corrente = null; R = null; corpi = {};
  document.body.classList.remove("nero");
  $("seed").value = seedScelto; $("fine").style.display = "none";
  mostraTesto("Pronto. Seed " + seedScelto + ", " + CIFRE[numCorpi] + " corpi. Premi AVVIA.", "attesa");
  aggiornaTesta(); aggiornaPulsanti();
}
function finePartita() {
  statoPagina = "finito"; generazione++; clearTimeout(timerBattuta); clearInterval(window.__sottofondo);
  mostraTesto("·", "silenzio"); rilasciaWakeLock();
  $("fine").innerHTML = "<h2>Fine — seed " + R.seed + "</h2>" + tabellaPercentuali();
  $("fine").style.display = "block";
  // partita da 10 minuti: alla fine lo schermo diventa nero (un clic lo toglie e mostra il riepilogo)
  if (VERSIONE.fineNera) document.body.classList.add("nero");
  aggiornaPulsanti(); aggiornaTesta();
}
// ── REGOLE, POI PARTITA (come nel base, senza il loop): le regole una volta, poi 10 s di silenzio,
// poi il conto "Dieci… Via" e la partita. Premuto di nuovo, annulla. CARICA REGOLE sceglie un altro file audio.
const SILENZIO_DOPO_REGOLE = 10;
let regoleInCorso = false, silenzioRegole = null;
function statoRegole(testo) { $("stato-regole").textContent = testo || descrizioneRegole(); }
function statoMusica() { $("stato-musica").textContent = descrizioneMusica(); }
function annullaRegole() {
  fermaRegole(); clearInterval(silenzioRegole); silenzioRegole = null; regoleInCorso = false;
  statoRegole(); aggiornaPulsanti();
}
function regole() {
  if (regoleInCorso || silenzioRegole) { annullaRegole(); return; }
  if (statoPagina !== "pronto") return;
  sbloccaAudio();   // nel gesto: così poi la partita parte da sola
  regoleInCorso = suonaRegole(fineRegole, () => { regoleInCorso = false; statoRegole("il browser ha bloccato l'audio — premi di nuovo"); aggiornaPulsanti(); });
  if (!regoleInCorso) { statoRegole("regole: nessun file — usa CARICA REGOLE"); return; }
  statoRegole("regole in corso · " + Audio_.nomeRegole + " · poi la partita");
  aggiornaPulsanti();
}
function fineRegole() {
  if (!regoleInCorso) return;
  regoleInCorso = false;
  let k = SILENZIO_DOPO_REGOLE;
  const mostra = () => statoRegole("silenzio · la partita parte tra " + k + " s");
  mostra();
  silenzioRegole = setInterval(() => {
    k--;
    if (k > 0) { mostra(); return; }
    clearInterval(silenzioRegole); silenzioRegole = null; statoRegole();
    if (statoPagina === "pronto") avviaConConto(); else aggiornaPulsanti();
  }, Math.max(30, 1000 / ACCELERA));
  aggiornaPulsanti();
}

// ── wake lock ──
async function richiediWakeLock() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
function rilasciaWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && statoPagina === "corsa") richiediWakeLock(); });

// ── schermo ──
function mostraTesto(t, classe) { const el = $("ordine"); el.textContent = t; el.className = classe || ""; }
function avviso(t) { const el = $("avvisi"); el.textContent = t; el.style.display = "block"; }
function aggiornaTesta() {
  const t = R ? tempoPartita() : 0;
  $("orologio").textContent = mmss(t) + " / " + mmss(VERSIONE.durata);
  // la pausa: un grande cronometro discreto con il tempo che manca
  const inPausa = !!(R && R.seg && R.seg.tipo === "intervallo" && statoPagina !== "pronto");
  $("cronometro").style.display = inPausa ? "flex" : "none";
  if (inPausa) $("cronometro").textContent = mmss(Math.ceil(VERSIONE.pausa[1] - t));
  document.body.classList.toggle("in-pausa", inPausa);
  // la luce rossa della parte 2 (fondo rosso scuro senza DIMOSTRAZIONE; l'indicatore per la regia sempre)
  document.body.classList.toggle("rossa", !!(R && VERSIONE.luceRossaDa !== undefined && t >= VERSIONE.luceRossaDa && statoPagina !== "pronto"));
  $("fase").textContent = R && R.seg ? (R.seg.tipo + (R.seg.tipo === "rottura" ? " · scenario " + R.scenario : "")) : "";
  $("barra-dentro").style.width = Math.min(100, 100 * t / VERSIONE.durata) + "%";
  if (R && statoPagina === "corsa") { const v = velocitaPercepita(intensitaOra(t)); $("velocita").textContent = "velocità " + Math.round(100 * v) + "%"; }
  if (VERSIONE.quinto && R) $("stato-cinque").textContent = R.cinque.stato === "attivo" ? "cinque (il pubblico): " + statoCinque() : "cinque (il pubblico): dalle " + mmss(VERSIONE.quinto.da);
  if (VERSIONE.generativo) aggiornaGenerativo();
}
// i numeri del generativo: secondi medi per richiesta e quante volte la coda si è svuotata (il modello regge il ritmo?)
function aggiornaGenerativo() {
  const s = R && R.gen ? statisticheGen() : null;
  const modello = MODELLO_FINTO ? "modello finto" : statoServer ? statoServer.modello + (statoServer.ollama ? (statoServer.installato ? "" : " (non scaricato)") : " (Ollama non risponde)") : "server locale assente";
  let testo = generativoScelto ? "GENERATIVO LOCALE · " + modello : "COMBINATORIO";
  if (s && generativoScelto) testo += " · " + (s.secondiMediPerRichiesta !== null ? s.secondiMediPerRichiesta + " s per richiesta" : "prima richiesta in corso") +
    " · coda vuota " + s.codeVuote + " volte (" + Math.round(s.secondiACodaVuota) + " s) · in coda " + s.inCoda + " · scartate " + s.scartate;
  if (s && s.dalCombinatorio) testo += " · dal combinatorio " + s.dalCombinatorio;
  $("gen").textContent = testo;
  // l'avviso non è mai parlato: solo a schermo, e intanto si continua a riprovare
  if (R && R.gen && statoPagina === "corsa") aggiornaAvviso(tempoPartita());
  const av = !!(R && R.gen && R.gen.avviso && generativoScelto && statoPagina === "corsa");
  $("avviso-modello").style.display = av ? "block" : "none";
  if (av) { const ult = R.gen.richieste.filter(x => x.errore).slice(-1)[0];
    $("avviso-modello").textContent = "Il modello locale non risponde da più di " + TIMEOUT_MODELLO + " s" + (ult ? " (" + ult.errore + ")" : "") + ". La partita continua; riprovo. Per passare al combinatorio: COMBINATORIO."; }
}
async function leggiStatoServer() {
  if (!DAL_SERVER || MODELLO_FINTO) return;
  try { statoServer = await (await fetch("/api/stato")).json(); } catch (e) { statoServer = null; }
  if (R && R.gen && statoServer) R.gen.modello = statoServer.modello;
}
function aggiornaPulsanti() {
  const s = statoPagina;
  $("avvia").disabled = s !== "pronto";
  $("freeze").disabled = !(s === "corsa" || s === "fermo"); $("freeze").textContent = s === "fermo" ? "RIPRENDI" : "FREEZE";
  $("salta").disabled = s !== "corsa";
  $("reset").disabled = s === "pronto" && !R;
  $("nuova").disabled = s === "corsa" || s === "conto";
  const attese = regoleInCorso || !!silenzioRegole;
  $("regole").textContent = attese ? "ANNULLA" : "REGOLE, POI PARTITA";
  $("regole").disabled = !attese && s !== "pronto";
  $("carica-regole").disabled = attese || s === "corsa" || s === "conto";
  $("carica-musica").disabled = s === "corsa" || s === "conto";
  $("esporta").disabled = !R;
  $("seed").disabled = s !== "pronto";
  document.querySelectorAll("#corpi button").forEach(b => { b.disabled = s !== "pronto"; b.classList.toggle("scelto", +b.dataset.n === numCorpi); });
}
// l'ultimo ordine dato al cinque, come lo si vede dalla regia ("ridono", "occhi chiusi")
function statoCinque() {
  const c = corpi[CINQUE], k = CANALI.filter(k0 => c.canali[k0].stato !== STATI.FERMO).map(k0 => c.canali[k0].azione);
  const nomi = { c_ridete: "ridono", c_ridete_di: "ridono", c_insultate: "insultano", c_applaudite: "applaudono", c_applaudite_numero: "applaudono", c_applaudite_finale: "applaudono",
    c_silenzio: "in silenzio", c_bisbigliate: "bisbigliano", c_braccio: "braccio alzato", c_occhi: "occhi chiusi", c_piedi: "battono i piedi",
    c_indicate: "indicano", c_guardate: "guardano un numero", c_dite_numero: "dicono un numero" };
  const s = k.map(a => nomi[a]).filter(Boolean);
  return s.length ? s.join(", ") : "fermo";
}
function impostaDimostrazione(on) {
  document.body.classList.toggle("demo", on);
  $("dimostrazione").classList.toggle("scelto", on);
  $("dimostrazione").textContent = on ? "DIMOSTRAZIONE: SÌ" : "DIMOSTRAZIONE: NO";
}
// il taglio (partita.html): all'istante fissato la voce si interrompe, anche a metà ordine, e si passa alla pausa
function controllaTaglio() {
  if (!R || statoPagina !== "corsa" || !VERSIONE.taglio || R.tagliato || tempoPartita() < VERSIONE.taglio) return;
  try { if (!VOCE_SIMULATA) speechSynthesis.cancel(); } catch (e) {}
  clearTimeout(timerBattuta); clearTimeout(paracadute); generazione++; fermaArchivio(); corrente = null;
  avanti();
}
function disegna() {
  controllaTaglio();
  if (document.body.classList.contains("demo") && R) {
    const t = tempoPartita();
    if (statoPagina === "corsa") aggiorna(t);
    disegnaPalco($("palco"), t); disegnaManichini($("manichini"), t); righeStato($("righe"), t);
  }
  aggiornaTesta();
}

// ── avvio della pagina ──
function iniziaPagina() {
  document.title = VERSIONE.titolo + " — " + VERSIONE.sottotitolo;
  preparaAudio(avviso);
  if (!VOCE_SIMULATA) { scegliVoce(); speechSynthesis.onvoiceschanged = scegliVoce; }
  $("avvia").onclick = avviaConConto; $("freeze").onclick = freeze; $("salta").onclick = salta;
  $("reset").onclick = () => reset(false); $("nuova").onclick = () => reset(true); $("regole").onclick = regole;
  $("carica-regole").onclick = () => $("file-regole").click();
  $("file-regole").onchange = () => { const f = $("file-regole").files && $("file-regole").files[0]; if (!f) return; annullaRegole(); caricaRegole(f); statoRegole(); };
  ["loadedmetadata", "error"].forEach(ev => Audio_.el.regole.addEventListener(ev, () => { if (!regoleInCorso && !silenzioRegole) statoRegole(); }));
  // CARICA MUSICA: la musica della parte 2 (?filemusica=percorso per le prove)
  $("carica-musica").onclick = () => $("file-musica").click();
  $("file-musica").onchange = () => { const f = $("file-musica").files && $("file-musica").files[0]; if (!f) return; caricaMusica(f); statoMusica(); };
  ["loadedmetadata", "error"].forEach(ev => Audio_.el.musica.addEventListener(ev, statoMusica));
  if (PARAM.get("filemusica")) { Audio_.nomeMusica = PARAM.get("filemusica").split("/").pop(); Audio_.musicaCaricata = true; Audio_.disponibile.musica = true; Audio_.el.musica.src = PARAM.get("filemusica"); }
  // (per le prove: ?regole=auto le avvia da sola; ?fileregole=percorso usa un altro file)
  if (PARAM.get("fileregole")) { Audio_.nomeRegole = PARAM.get("fileregole").split("/").pop(); Audio_.el.regole.src = PARAM.get("fileregole"); }
  $("esporta").onclick = esportaLog;
  document.addEventListener("click", () => { if (document.body.classList.contains("nero") && statoPagina === "finito") document.body.classList.remove("nero"); });
  $("dimostrazione").onclick = () => impostaDimostrazione(!document.body.classList.contains("demo"));
  document.querySelectorAll("#corpi button").forEach(b => { b.onclick = () => { numCorpi = +b.dataset.n; reset(false); }; });
  $("seed").onchange = () => { const s = Math.floor(+$("seed").value); if (s > 0) { seedScelto = s; reset(false); } };
  impostaDimostrazione(PARAM.get("demo") === "1");
  if (VERSIONE.generativo) {
    $("modo").hidden = false; $("gen").hidden = false; $("origine").hidden = false;
    $("modo").onclick = () => impostaGenerativo(!generativoScelto);
    impostaGenerativo(generativoScelto);
    leggiStatoServer(); setInterval(leggiStatoServer, 15000);
  }
  reset(false);
  // la vista si ridisegna anche a intervalli (in alcuni casi requestAnimationFrame non arriva)
  const rid = () => { disegna(); requestAnimationFrame(rid); };
  requestAnimationFrame(rid); setInterval(disegna, 100);
  if (PARAM.get("avvio") === "auto") setTimeout(avviaConConto, 50);
  if (PARAM.get("regole") === "auto") setTimeout(regole, 50);
  statoRegole(); statoMusica();
}
document.addEventListener("DOMContentLoaded", iniziaPagina);
</script>
